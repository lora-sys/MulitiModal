[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "fast: 纯契约/单元逻辑，无文件 I/O 与网络；CI 第一道门禁",
    "slow: 集成、模型前向、Bootstrap 等长耗时用例；CI 按需启用",
    "synthetic: 仅使用合成 fixture 的测试",
    "real_data: 需 data/local/ 私有数据，默认跳过，不计入常规 CI 通过数",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# dashboard.py embeds a complete single-page HTML/CSS/JS document as a string;
# wrapping those lines to 100 columns would make the page unreadable and does
# not improve the Python
"src/research/dashboard.py" = ["E501"]
