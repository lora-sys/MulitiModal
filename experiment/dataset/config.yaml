# 数据集配置
dataset:
  name: "multimodal_realonly"
  num_workers: 4
  batch_size: 32
  pin_memory: true
  shuffle: true

# 数据源配置
source:
  type: "csv"
  params:
    base_path: "/root/repos/MulitiModal/experiment/data"
    label_map:
      身体表征很差: 0
      身体表征一般: 1
      身体表征正常: 2
      身体表征良好: 3

# 统一 NPZ 数据集配置（只使用真实数据，无虚拟样本）
unified_npz:
  path: "experiment/model/unified_dataset_realonly.npz"  # 3750 样本，3分类

# 预处理器配置
preprocessor:
  type: "self_healing"
  params:
    sampling_rate: 50
    target_length: 1000
    num_channels: 2
    num_static_features: 4
    healing:
      window_size: 15
      sigma_threshold: 3
    filter:
      lowcut: 0.1
      highcut: 10
      order: 2
    normalization:
      dynamic: "zscore"
      static: "standard"

# 模型配置
model:
  type: "multimodal"
  params:
    dyn_channels: 2
    static_dim: 4
    num_classes: 3  # 改为 3 分类
